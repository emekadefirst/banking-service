version: '3.8'

services:
  blnk-ledger:
    image: jerryansel/blnk:latest
    container_name: blnk-ledger-core
    env_file:
      - ../.env 
    ports:
      - "5001:5001"
    volumes:
      - ./blnk.json:/blnk.json
    command: ["blnk", "start", "--config", "/blnk.json"]
    restart: unless-stopped
    networks:
      - bankcorenet

networks:
  bankcorenet:
    external: true
