services:
  bank-core-redis:
    image: redis:7.2.4
    container_name: bank-core-redis
    restart: on-failure
    env_file: ../../.env
    networks: [bankcorenet]

  blnk-ledger:
    image: jerryenebeli/blnk:0.13.2
    container_name: blnk-ledger-core
    entrypoint: ["/bin/sh", "-c"]
    command: ["blnk migrate up && blnk start"]
    ports:
      - "5001:5001"
    volumes:
      - ./blnk.json:/blnk.json
    depends_on: [bank-core-redis]
    restart: on-failure
    env_file: ../../.env
    networks: [bankcorenet]

  blnk-worker:
    image: jerryenebeli/blnk:0.13.2
    container_name: blnk-worker
    entrypoint: ["blnk", "workers"]
    volumes:
      - ./blnk.json:/blnk.json
    depends_on: [bank-core-redis]
    restart: on-failure
    env_file: ../../.env
    networks: [bankcorenet]

networks:
  bankcorenet:
    external: true